<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンラインオセロ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      color: #e0c97f;
      letter-spacing: 3px;
    }

    /* ── ロビー ── */
    #lobby {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    #lobby p {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #roomInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid #444;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      outline: none;
      letter-spacing: 2px;
    }
    #roomInput:focus { border-color: #e0c97f; }

    button {
      padding: 12px 18px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    #generateBtn {
      background: #3a5a8a;
      color: #eee;
      white-space: nowrap;
    }
    #generateBtn:hover { background: #4a7ab0; }

    #joinBtn {
      background: #e0c97f;
      color: #1a1a2e;
      width: 100%;
      font-size: 1rem;
    }
    #joinBtn:hover { background: #c8a830; }

    /* ── ゲーム画面 ── */
    #game { width: 100%; max-width: 480px; display: none; }

    #colorBadge {
      display: inline-block;
      padding: 5px 18px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.9rem;
      border: 2px solid #888;
    }

    #status {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1rem;
      min-height: 24px;
      color: #aad4f5;
    }

    #scores {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 1.1rem;
    }
    .score-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-disc {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #888;
    }
    .score-disc.black {
      background: radial-gradient(circle at 35% 35%, #555, #111);
    }
    .score-disc.white {
      background: radial-gradient(circle at 35% 35%, #fff, #ccc);
    }
    .score-num {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 28px;
    }

    /* ── オセロ盤 ── */
    #board-wrap {
      display: flex;
      justify-content: center;
    }

    #board {
      /* 盤自体は 8×8 のセルを囲む外枠 */
      display: inline-block;
      background: #1a5c2a;
      border: 6px solid #5a3a10;
      border-radius: 4px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,0,0,0.3);
      /* gridはJSで生成したdivに任せる */
      position: relative;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
    }

    .cell {
      width: 52px;
      height: 52px;
      border: 1px solid #147a2c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #1d6b30;
    }

    /* 4隅の星点 */
    .cell.star::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: #147a2c;
      border-radius: 50%;
      z-index: 0;
    }

    /* 置ける場所のヒント */
    .cell.valid {
      cursor: pointer;
    }
    .cell.valid:hover { background: #257a3a; }
    .hint-dot {
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
    }

    /* 直前の手のマーカー */
    .last-marker {
      position: absolute;
      width: 30%;
      height: 30%;
      background: rgba(255, 220, 50, 0.55);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    /* 石 */
    .disc {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      position: relative;
      z-index: 1;
      animation: placeDisc 0.12s ease-out;
    }
    @keyframes placeDisc {
      from { transform: scale(0.4); opacity: 0.5; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .disc.black {
      background: radial-gradient(circle at 35% 30%, #5a5a5a, #111 70%);
      box-shadow: 2px 3px 6px rgba(0,0,0,0.7);
    }
    .disc.white {
      background: radial-gradient(circle at 35% 30%, #ffffff, #cccccc 70%);
      box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
    }

    #restartBtn {
      display: none;
      margin-top: 16px;
      background: #e0c97f;
      color: #1a1a2e;
      width: 100%;
      font-size: 1rem;
    }
    #restartBtn:hover { background: #c8a830; }

    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .cell { width: 40px; height: 40px; }
    }
    @media (max-width: 360px) {
      .cell { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <h1>オンラインオセロ</h1>

  <div id="lobby">
    <p>ルームIDを共有して相手と同じルームに入ると対戦できます。<br>「発行」ボタンでランダムなIDを生成できます。</p>
    <div class="input-row">
      <input type="text" id="roomInput" placeholder="数字4桁" maxlength="4" inputmode="numeric" pattern="\d{4}">
      <button id="generateBtn">発行</button>
    </div>
    <button id="joinBtn">ルームに入る</button>
  </div>

  <div id="game">
    <div style="text-align:center; margin-bottom:10px;">
      <div id="colorBadge"></div>
    </div>
    <div id="status"></div>
    <div id="scores">
      <div class="score-box">
        <div class="score-disc black"></div>
        <span class="score-num" id="scoreB">2</span>
      </div>
      <div class="score-box">
        <div class="score-disc white"></div>
        <span class="score-num" id="scoreW">2</span>
      </div>
    </div>
    <div id="board-wrap">
      <div id="board">
        <div class="board-grid" id="grid"></div>
      </div>
    </div>
    <button id="restartBtn">もう一度遊ぶ</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myColor = null;

    // 星点の位置
    const STARS = new Set(['2,2','2,5','5,2','5,5']);

    // ── ロビー ──
    document.getElementById('generateBtn').addEventListener('click', () => {
      // crypto.getRandomValues でセキュアなランダムID生成
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      const id = String(arr[0] % 10000).padStart(4, '0');
      document.getElementById('roomInput').value = id;
    });

    document.getElementById('joinBtn').addEventListener('click', joinRoom);
    document.getElementById('roomInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinRoom();
    });

    const ROOM_ID_PATTERN = /^\d{4}$/;
    function joinRoom() {
      const roomId = document.getElementById('roomInput').value.trim();
      if (!ROOM_ID_PATTERN.test(roomId)) {
        setStatus('ルームIDは数字4桁で入力してください');
        return;
      }
      socket.emit('joinRoom', roomId);
    }

    // ── Socket イベント ──
    socket.on('assignColor', (color) => {
      myColor = color;
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      const badge = document.getElementById('colorBadge');
      badge.textContent = color === 'B' ? '● 黒（先手）' : '○ 白（後手）';
      badge.style.background = color === 'B' ? '#111' : '#eee';
      badge.style.color = color === 'B' ? '#eee' : '#111';
    });

    socket.on('waiting', () => {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      setStatus('相手の接続を待っています...');
      renderBoard(createEmptyBoard(), [], null);
    });

    socket.on('roomFull', () => alert('そのルームは満員です。別のルームIDを試してください。'));

    socket.on('gameStart', ({ board, currentTurn, validMoves }) => {
      renderBoard(board, validMoves, null);
      updateScores(board);
      setTurnStatus(currentTurn, validMoves);
      document.getElementById('restartBtn').style.display = 'none';
    });

    socket.on('boardUpdate', ({ board, currentTurn, validMoves, lastMove, skipped }) => {
      renderBoard(board, validMoves, lastMove);
      updateScores(board);
      if (skipped) {
        const label = skipped === 'B' ? '黒' : '白';
        setStatus(`${label}は置く場所がないためスキップ`);
        setTimeout(() => setTurnStatus(currentTurn, validMoves), 1500);
      } else {
        setTurnStatus(currentTurn, validMoves);
      }
    });

    socket.on('gameOver', ({ board, counts, winner, lastMove }) => {
      renderBoard(board, [], lastMove);
      updateScores(board);
      let msg = !winner ? '引き分けです！' : winner === myColor ? 'あなたの勝ちです！' : 'あなたの負けです...';
      setStatus(`ゲーム終了 — ${msg}`);
      document.getElementById('restartBtn').style.display = 'block';
    });

    socket.on('opponentLeft', () => setStatus('相手が切断しました。'));
    socket.on('secError', (msg) => setStatus(`⚠️ ${msg}`));
    socket.on('roomExpired', () => setStatus('部屋が30分経過のため終了しました。再度ルームに入ってください。'));

    document.getElementById('restartBtn').addEventListener('click', () => {
      socket.emit('restartGame');
      document.getElementById('restartBtn').style.display = 'none';
    });

    // ── 描画 ──
    function renderBoard(board, validMoves, lastMove) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const validSet = new Set(validMoves.map(([r,c]) => `${r},${c}`));

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (STARS.has(`${r},${c}`)) cell.classList.add('star');

          if (lastMove && lastMove.row === r && lastMove.col === c) {
            const marker = document.createElement('div');
            marker.className = 'last-marker';
            cell.appendChild(marker);
          }

          if (board[r][c]) {
            const disc = document.createElement('div');
            disc.className = `disc ${board[r][c] === 'B' ? 'black' : 'white'}`;
            cell.appendChild(disc);
          } else if (validSet.has(`${r},${c}`)) {
            cell.classList.add('valid');
            const hint = document.createElement('div');
            hint.className = 'hint-dot';
            cell.appendChild(hint);
            cell.addEventListener('click', () => socket.emit('makeMove', { row: r, col: c }));
          }

          grid.appendChild(cell);
        }
      }
    }

    function createEmptyBoard() {
      const b = Array(8).fill(null).map(() => Array(8).fill(null));
      b[3][3]='W'; b[3][4]='B'; b[4][3]='B'; b[4][4]='W';
      return b;
    }

    function updateScores(board) {
      let B = 0, W = 0;
      for (const row of board) for (const cell of row) { if(cell==='B') B++; if(cell==='W') W++; }
      document.getElementById('scoreB').textContent = B;
      document.getElementById('scoreW').textContent = W;
    }

    function setTurnStatus(turn, moves) {
      if (turn === myColor) setStatus(moves.length > 0 ? 'あなたの番です' : '置く場所がありません');
      else setStatus('相手の番です...');
    }

    function setStatus(msg) { document.getElementById('status').textContent = msg; }
  </script>
</body>
</html>
