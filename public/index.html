<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンラインオセロ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 24px;
      color: #e0c97f;
      letter-spacing: 3px;
    }

    /* ── ロビー ── */
    #lobby {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    #lobby p {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    #roomInput {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid #444;
      border-radius: 8px;
      background: #16213e;
      color: #eee;
      outline: none;
      letter-spacing: 2px;
    }
    #roomInput:focus { border-color: #e0c97f; }

    button {
      padding: 12px 18px;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    #generateBtn {
      background: #3a5a8a;
      color: #eee;
      white-space: nowrap;
    }
    #generateBtn:hover { background: #4a7ab0; }

    #joinBtn {
      background: #e0c97f;
      color: #1a1a2e;
      width: 100%;
      font-size: 1rem;
    }
    #joinBtn:hover { background: #c8a830; }

    /* ── ゲーム画面 ── */
    #game { width: 100%; max-width: 480px; display: none; }

    #colorBadge {
      display: inline-block;
      padding: 5px 18px;
      border-radius: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 0.9rem;
      border: 2px solid #888;
    }

    #status {
      text-align: center;
      margin-bottom: 10px;
      font-size: 1rem;
      min-height: 24px;
      color: #aad4f5;
    }

    #scores {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 14px;
      font-size: 1.1rem;
    }
    .score-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-disc {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #888;
    }
    .score-disc.black {
      background: radial-gradient(circle at 35% 35%, #555, #111);
    }
    .score-disc.white {
      background: radial-gradient(circle at 35% 35%, #fff, #ccc);
    }
    .score-num {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 28px;
    }

    /* ── オセロ盤 ── */
    #board-wrap {
      display: flex;
      justify-content: center;
    }

    #board {
      /* 盤自体は 8×8 のセルを囲む外枠 */
      display: inline-block;
      background: #1a5c2a;
      border: 6px solid #5a3a10;
      border-radius: 4px;
      box-shadow: 0 6px 32px rgba(0,0,0,0.6), inset 0 0 12px rgba(0,0,0,0.3);
      /* gridはJSで生成したdivに任せる */
      position: relative;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
    }

    .cell {
      width: 52px;
      height: 52px;
      border: 1px solid #147a2c;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #1d6b30;
    }

    /* 4隅の星点 */
    .cell.star::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      background: #147a2c;
      border-radius: 50%;
      z-index: 0;
    }

    /* 置ける場所のヒント */
    .cell.valid {
      cursor: pointer;
    }
    .cell.valid:hover { background: #257a3a; }
    .hint-dot {
      width: 28%;
      height: 28%;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
    }

    /* 直前の手のマーカー */
    .last-marker {
      position: absolute;
      width: 30%;
      height: 30%;
      background: rgba(255, 220, 50, 0.55);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    /* 石 */
    .disc {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      position: relative;
      z-index: 1;
      animation: placeDisc 0.12s ease-out;
    }
    @keyframes placeDisc {
      from { transform: scale(0.4); opacity: 0.5; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .disc.black {
      background: radial-gradient(circle at 35% 30%, #5a5a5a, #111 70%);
      box-shadow: 2px 3px 6px rgba(0,0,0,0.7);
    }
    .disc.white {
      background: radial-gradient(circle at 35% 30%, #ffffff, #cccccc 70%);
      box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
    }

    #restartBtn {
      display: none;
      margin-top: 16px;
      background: #e0c97f;
      color: #1a1a2e;
      width: 100%;
      font-size: 1rem;
    }
    #restartBtn:hover { background: #c8a830; }

    @media (max-width: 480px) {
      h1 { font-size: 1.4rem; }
      .cell { width: 40px; height: 40px; }
    }
    @media (max-width: 360px) {
      .cell { width: 34px; height: 34px; }
    }
  </style>
</head>
<body>
  <h1>オンラインオセロ</h1>

  <div id="lobby">
    <p>ルームIDを共有して相手と同じルームに入ると対戦できます。<br>「発行」ボタンでランダムなIDを生成できます。</p>
    <div class="input-row">
      <input type="text" id="roomInput" placeholder="数字4桁" maxlength="4" inputmode="numeric" pattern="\d{4}">
      <button id="generateBtn">発行</button>
    </div>
    <button id="joinBtn">ルームに入る</button>
    <p id="lobbyError" style="color:#f87171; margin-top:10px; min-height:20px; font-size:0.9rem;"></p>
  </div>

  <div id="game">
    <div style="text-align:center; margin-bottom:10px;">
      <div id="colorBadge"></div>
    </div>
    <div id="status"></div>
    <div id="scores">
      <div class="score-box">
        <div class="score-disc black"></div>
        <span class="score-num" id="scoreB">2</span>
      </div>
      <div class="score-box">
        <div class="score-disc white"></div>
        <span class="score-num" id="scoreW">2</span>
      </div>
    </div>
    <div id="board-wrap">
      <div id="board">
        <div class="board-grid" id="grid"></div>
      </div>
    </div>
    <button id="restartBtn">もう一度遊ぶ</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/main.js"></script>
</body>
</html>
